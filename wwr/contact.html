<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Contact Whitewater Rafting for questions, reservations, and more information about our rafting adventures.">
        <meta name="author" content="Elena Well Diaz">
        <title>Whitewater Rafting | Contact Us</title>
        <link rel="stylesheet" href="styles/rafting.css">
    </head>

    <body>
        <header>
            <img src="images/logo-whitewater-rafting.png"
                alt="Company logo">

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h1>Whitewater Rafting</h1>
            <section class="company-info">
                <h2>Contact Information</h2>

                <p>Address: 123 River Road, Kolob, California</p>
                <p>Phone: (555) 123-4557</p>
                <p>Email: info@whitewaterrafting.com</p>

                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d196.80185636696163!2d-122.04236325193534!3d37.88766512950245!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808561d58c26a8a1%3A0x5542df3f3637c8b1!2s2151%20San%20Miguel%20Dr%2C%20Walnut%20Creek%2C%20CA%2094596%2C%20USA!5e0!3m2!1sen!2sph!4v1790764876136!5m2!1sen!2sph"
                    width="600"
                    height="450"
                    allowfullscreen
                    loading="lazy">
                </iframe>
            </section>

            <section class="employees">
                <h2>Meet Our Team</h2>

                <figure>
                    <img src="images/employee-1.webp"
                        alt="Lucas Bennett">
                    <figcaption>Lucas Bennett | River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-2.webp"
                        alt="Ethan Brooks">
                    <figcaption>Ethan Brooks | Safety Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-3.webp"
                        alt="Alex Morgan">
                    <figcaption>Alex Morgan | Reservations Manager</figcaption>
                </figure>
            </section>

            <section class="contact-form">
                <h2>Send Us a Message</h2>

                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <fieldset>
                        <legend>Purpose of Message</legend>

                        <input type="radio" id="general" name="purpose" value="general" required>
                        <label for="general">General Inquiry</label>

                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>

                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </fieldset>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6" required></textarea>

                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Send Message</button>
                </form>
            </section>
        </main>

        <footer>
            <p>
                ©️ 2026 | Whitewater Rafting | Elena Well Diaz
            </p>

            <nav class="socialmedia">
                <a href="https://instagram.com">
                    <img src="images/instagram-square.webp"
                        alt="Instagram icon">
                </a>

                <a href="https://facebook.com">
                    <img src="images/facebook-square.webp"
                        alt="Facebook icon">
                </a>

                <a href="https://youtube.com">
                    <img src="images/youtube-square.webp"
                        alt="Youtube icon">
                </a>
            </nav>
        </footer>
    </body>
</html>
